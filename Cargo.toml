[package]
name = "mcp-guard"
version = "0.1.0"
edition = "2021"
authors = ["MCP-Guard Team"]
description = "The Airbag & Security Shield for AI Agents using the Model Context Protocol (MCP)"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
async-trait = "0.1"

[[bin]]
name = "mcp-guard"
path = "src/main.rs"

[[bin]]
name = "safemca"
path = "src/main.rs"
