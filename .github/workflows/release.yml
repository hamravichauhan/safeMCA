name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: safemca-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: safemca-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: safemca-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifacts
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/safemca staging/
          cp target/${{ matrix.target }}/release/mcp-guard staging/
          cp README.md LICENSE staging/
          tar -czvf ${{ matrix.artifact_name }} -C staging .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
